name: Kubernetes Manifest Validation

on:
  push:
    branches:
      - main
    paths:
      - 'k8s-three-tier/**/*.yaml'
      - 'k8s-three-tier/**/*.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'k8s-three-tier/**/*.yaml'
      - 'k8s-three-tier/**/*.yml'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Install kubeconform
        run: |
          curl -L -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

      - name: Validate Kubernetes manifests
        run: |
          echo "=== Validating K8s Manifests ==="

          find k8s-three-tier \
            -type f \( -name "*.yaml" -o -name "*.yml" \) \
            ! -path "*/grafana/provisioning/*" \
            ! -path "*/monitoring/prometheus/prometheus.yml" \
            ! -path "*/docker-compose.monitoring.yml" \
            -print0 |
          while IFS= read -r -d '' file; do
            echo "Validating: $file"
            kubeconform \
              -strict \
              -summary \
              "$file"
          done

          echo "✓ All manifests valid"

      - name: Check resource naming conventions
        run: |
          echo "=== Checking Naming Conventions ==="

          find k8s-three-tier \
            -type f \( -name "*.yaml" -o -name "*.yml" \) \
            -print0 |
          while IFS= read -r -d '' file; do
            if grep -E "^[[:space:]]*name: [A-Z_]" "$file"; then
              echo "⚠ Error: Found uppercase or underscore in resource name: $file"
              exit 1
            fi
          done

          echo "✓ Naming conventions OK"

      - name: Validate resource limits
        run: |
          echo "=== Checking Resource Limits ==="

          find k8s-three-tier \
            -type f \( -name "*.yaml" -o -name "*.yml" \) \
            -print0 |
          while IFS= read -r -d '' file; do
            if grep -qE "^[[:space:]]*kind: (Deployment|StatefulSet)$" "$file"; then
              if ! grep -q "resources:" "$file"; then
                echo "✗ Error: $file missing resource limits"
                exit 1
              fi
            fi
          done

          echo "✓ Resource limits configured"

      - name: Security scan
        run: |
          echo "=== Running Security Scan ==="
          curl -sSX POST \
            --data-binary @k8s-three-tier/04-postgres-statefulset.yaml \
            https://v2.kubesec.io/scan || true
          echo "✓ Security scan complete"

      - name: Generate deployment report
        if: success()
        run: |
          echo "## ✓ Kubernetes Manifest Validation Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Date**: $(date)" >> "$GITHUB_STEP_SUMMARY"
          echo "**Status**: All checks passed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Manifests Validated" >> "$GITHUB_STEP_SUMMARY"
          find k8s-three-tier \
            -maxdepth 2 \
            -type f \( -name "*.yaml" -o -name "*.yml" \) |
            sort >> "$GITHUB_STEP_SUMMARY"