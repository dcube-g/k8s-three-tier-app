name: K8s Deploy

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint YAML files
        run: |
          for file in k8s-three-tier/**/*.yml k8s-three-tier/**/*.yaml; do
            if [ -f "$file" ]; then
              echo "Linting $file"
              yamllint "$file" || exit 1
            fi
          done

      - name: Kubernetes schema validation
        run: |
          echo "=== Kubernetes Schema Validation ==="

          curl -L -sSf \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            -o /tmp/kubeconform.tar.gz

          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

          find k8s-three-tier -type f \( -name "*.yaml" -o -name "*.yml" \) \
            ! -path "*/grafana/provisioning/*" \
            ! -path "*/monitoring/prometheus/prometheus.yml" \
            ! -path "*/docker-compose.monitoring.yml" -print0 |
          while IFS= read -r -d '' file; do
            echo "Validating: $file"
            kubeconform -strict -summary "$file" || exit 1
          done

          echo "=== Validation Complete ==="
