apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    app: three-tier-app
type: Opaque
data:
  # Base64-encoded values - generate with: echo -n 'value' | base64
  # TODO: Replace with actual secure values before deployment

  # PostgreSQL credentials (required)
  postgres-user: TODO_BASE64_ENCODED_USERNAME
  postgres-password: TODO_BASE64_ENCODED_STRONG_PASSWORD

  # Database host (if not using internal service discovery)
  postgres-host: TODO_BASE64_ENCODED_HOST

  # JWT secret for backend authentication
  jwt-secret: TODO_BASE64_ENCODED_JWT_SECRET_KEY

  # API keys for external services (if needed)
  external-api-key: TODO_BASE64_ENCODED_API_KEY

  # Encryption key for sensitive data
  encryption-key: TODO_BASE64_ENCODED_32_BYTE_KEY

---
